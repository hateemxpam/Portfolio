<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="25%" cy="30%" r="90%">
      <stop offset="0" stop-color="#1d2547"/>
      <stop offset="0.55" stop-color="#110f20"/>
      <stop offset="1" stop-color="#0b080c"/>
    </radialGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#88d3ce"/>
      <stop offset="1" stop-color="#6e45e2"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#88d3ce" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <!-- Scanned pack -->
  <g transform="translate(150 230)">
    <rect x="40" y="-30" width="300" height="400" rx="14" fill="#2a2638" transform="rotate(-6 190 170)"/>
    <rect x="20" y="-15" width="300" height="400" rx="14" fill="#353046" transform="rotate(-3 170 185)"/>
    <rect width="300" height="400" rx="14" fill="#ece8f4"/>
    <rect x="30" y="34" width="190" height="20" rx="6" fill="#3b3550"/>
    <g fill="#9a95ab">
      <rect x="30" y="86" width="240" height="11" rx="5"/>
      <rect x="30" y="112" width="210" height="11" rx="5"/>
      <rect x="30" y="138" width="230" height="11" rx="5"/>
      <rect x="30" y="190" width="240" height="70" rx="6" fill="none" stroke="#9a95ab" stroke-width="3"/>
      <path d="M30 213H270M30 237H270M110 190V260M190 190V260" stroke="#9a95ab" stroke-width="2"/>
      <rect x="30" y="292" width="180" height="11" rx="5"/>
      <rect x="30" y="318" width="120" height="11" rx="5"/>
    </g>
    <rect x="-10" y="150" width="320" height="6" fill="#88d3ce" opacity="0.9"/>
    <rect x="-10" y="120" width="320" height="66" fill="#88d3ce" opacity="0.15"/>
  </g>
  <text x="300" y="730" text-anchor="middle" font-size="26" fill="#88d3ce" letter-spacing="3">SCANNED PACK</text>

  <!-- arrow -->
  <path d="M520 430 H600" stroke="#88d3ce" stroke-width="5" stroke-linecap="round"/>
  <path d="M590 412 L612 430 L590 448" fill="none" stroke="#88d3ce" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Document types -->
  <g transform="translate(640 130)" font-size="22" font-weight="600">
    <text x="0" y="0" fill="#88d3ce" font-size="22" letter-spacing="2" font-weight="400">7 DOCUMENT TYPES</text>
    <g fill="#ffffff">
      <rect y="26" width="330" height="52" rx="26" fill="#1a2234" stroke="#88d3ce" stroke-opacity="0.4"/><text x="24" y="60">Purchase Requisition</text>
      <rect y="92" width="330" height="52" rx="26" fill="#1a2234" stroke="#88d3ce" stroke-opacity="0.4"/><text x="24" y="126">Advice to Purchase</text>
      <rect y="158" width="330" height="52" rx="26" fill="#1a2234" stroke="#88d3ce" stroke-opacity="0.4"/><text x="24" y="192">Declaration · Possession</text>
      <rect y="224" width="330" height="52" rx="26" fill="#1a2234" stroke="#88d3ce" stroke-opacity="0.4"/><text x="24" y="258">Schedule of Assets</text>
      <rect y="290" width="330" height="52" rx="26" fill="#1a2234" stroke="#88d3ce" stroke-opacity="0.4"/><text x="24" y="324">Offer to Sell</text>
      <rect y="356" width="330" height="52" rx="26" fill="#1a2234" stroke="#88d3ce" stroke-opacity="0.4"/><text x="24" y="390">Acknowledgment</text>
      <rect y="422" width="330" height="52" rx="26" fill="#1a2234" stroke="#88d3ce" stroke-opacity="0.4"/><text x="24" y="456">Sales Tax Invoice</text>
    </g>
    <rect y="510" width="330" height="70" rx="18" fill="url(#acc)" opacity="0.9"/>
    <text x="165" y="555" text-anchor="middle" fill="#ffffff">Azure OCR + LLM</text>
  </g>

  <!-- arrow -->
  <path d="M1000 430 H1060" stroke="#88d3ce" stroke-width="5" stroke-linecap="round"/>
  <path d="M1050 412 L1072 430 L1050 448" fill="none" stroke="#88d3ce" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Excel output -->
  <g transform="translate(1095 215)" font-size="20">
    <rect width="380" height="470" rx="18" fill="#121a17" stroke="#3ecf8e" stroke-opacity="0.55" stroke-width="2"/>
    <rect width="380" height="64" rx="18" fill="#1d6b45"/>
    <rect y="40" width="380" height="24" fill="#1d6b45"/>
    <text x="24" y="42" fill="#ffffff" font-weight="700" font-size="24">Review.xlsx</text>
    <g fill="#d9f5e6">
      <text x="24" y="112" fill="#7fd3a8">Field</text><text x="210" y="112" fill="#7fd3a8">Status</text>
      <path d="M0 128H380" stroke="#3ecf8e" stroke-opacity="0.3"/>
      <text x="24" y="170">Customer</text><text x="210" y="170" fill="#3ecf8e">✓ Verified</text>
      <text x="24" y="222">PR Date</text><text x="210" y="222" fill="#3ecf8e">✓ Verified</text>
      <text x="24" y="274">Cost Price</text><text x="210" y="274" fill="#3ecf8e">✓ Verified</text>
      <rect x="12" y="292" width="356" height="46" rx="10" fill="#f5b942" opacity="0.16"/>
      <text x="24" y="322">Supplier</text><text x="210" y="322" fill="#f5b942">Needs Review</text>
      <text x="24" y="378">Assets total</text><text x="210" y="378" fill="#3ecf8e">✓ Matches</text>
      <text x="24" y="430">Timeline</text><text x="210" y="430" fill="#3ecf8e">✓ In order</text>
    </g>
  </g>
  <text x="1285" y="760" text-anchor="middle" font-size="26" fill="#3ecf8e" letter-spacing="3">~1 MIN PER PACK</text>
</svg>
